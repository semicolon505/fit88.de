    <line x1="16" y1="112" x2="58" y2="112" stroke="#dbe9d9" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g stroke="#4a7a5e" stroke-width="6" stroke-linecap="round">
    <line x1="662" y1="130" x2="662" y2="156"/><line x1="649" y1="143" x2="675" y2="143"/>
  </g>
