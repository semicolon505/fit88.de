  </g>
  <!-- right pan: pills (lighter/up) -->
  <g>
    <line x1="496" y1="168" x2="456" y2="216" stroke="#315b46" stroke-width="8"/>
    <line x1="496" y1="168" x2="536" y2="216" stroke="#315b46" stroke-width="8"/>
