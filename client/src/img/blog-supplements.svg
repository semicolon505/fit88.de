  <rect x="356" y="352" width="76" height="14" rx="7" fill="#315b46"/>
  <path d="M368 366 l-22 44 M420 366 l22 44" stroke="#315b46" stroke-width="10" stroke-linecap="round"/>
  <!-- left pan: natural foods (heavier/down) -->
  <g>
    <line x1="304" y1="172" x2="264" y2="242" stroke="#315b46" stroke-width="8"/>
    <line x1="304" y1="172" x2="344" y2="242" stroke="#315b46" stroke-width="8"/>
