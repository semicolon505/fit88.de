    <path d="M22 128 l10 10 18 -20" stroke="#7da77e" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="66" y1="130" x2="108" y2="130" stroke="#dbe9d9" stroke-width="8" stroke-linecap="round"/>
