<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#f0f5ef"/>
  <circle cx="680" cy="100" r="85" fill="#dbe9d9"/>
  <circle cx="100" cy="400" r="90" fill="#dbe9d9" opacity=".6"/>

  <!-- yogurt jar: good bacteria source -->
  <g>
    <rect x="585" y="128" width="130" height="26" rx="13" fill="#315b46"/>
    <path d="M570 154 h160 v20 q0 110 -80 132 q-80 -22 -80 -132 Z" fill="#ffffff" stroke="#dbe9d9" stroke-width="6"/>
    <path d="M600 215 q18 -16 38 0 q18 16 38 0" stroke="#a9cba6" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M600 250 q18 -16 38 0 q18 16 38 0" stroke="#dbe9d9" stroke-width="9" fill="none" stroke-linecap="round"/>
    <g transform="translate(540 290) rotate(16)">
      <rect x="-6" y="-4" width="12" height="76" rx="6" fill="#4a7a5e"/>
      <ellipse cx="0" cy="84" rx="18" ry="27" fill="#8fbf8d"/>
    </g>
  </g>

  <!-- main good bacteria (coral capsule, friendly) -->
  <g transform="translate(400 220)">
    <path d="M0 -4 q0 -58 50 -58 q50 0 50 58 q0 58 -50 58 q-50 0 -50 -58 Z" fill="#e58f65"/>
    <circle cx="26" cy="-10" r="6" fill="#5c3320"/>
    <circle cx="74" cy="-10" r="6" fill="#5c3320"/>
    <path d="M34 18 q16 13 32 0" stroke="#5c3320" stroke-width="6" fill="none" stroke-linecap="round"/>
    <g stroke="#4a7a5e" stroke-width="6" stroke-linecap="round">
      <line x1="-20" y1="-34" x2="-40" y2="-50"/>
      <line x1="-24" y1="0" x2="-46" y2="0"/>
      <line x1="-20" y1="34" x2="-40" y2="50"/>
      <line x1="120" y1="-34" x2="140" y2="-50"/>
      <line x1="124" y1="0" x2="146" y2="0"/>
      <line x1="120" y1="34" x2="140" y2="50"/>
    </g>
  </g>

  <!-- small good bacteria (green) -->
  <g transform="translate(548 118)">
    <ellipse cx="0" cy="0" rx="26" ry="34" fill="#7da77e"/>
    <circle cx="-10" cy="-8" r="5" fill="#203129"/>
    <circle cx="10" cy="-8" r="5" fill="#203129"/>
    <path d="M-8 12 q8 7 16 0" stroke="#203129" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g stroke="#4a7a5e" stroke-width="5" stroke-linecap="round">
      <line x1="-20" y1="-18" x2="-34" y2="-30"/>
      <line x1="-24" y1="10" x2="-38" y2="14"/>
      <line x1="20" y1="-18" x2="34" y2="-30"/>
      <line x1="24" y1="10" x2="38" y2="14"/>
    </g>
  </g>

  <!-- broccoli (fibre) -->
  <g transform="translate(118 150)">
    <rect x="-10" y="34" width="22" height="58" rx="10" fill="#8fbf8d"/>
    <circle cx="-20" cy="28" r="26" fill="#7da77e"/>
    <circle cx="12" cy="10" r="30" fill="#7da77e"/>
    <circle cx="42" cy="32" r="24" fill="#7da77e"/>
    <circle cx="8" cy="-16" r="24" fill="#7da77e"/>
    <path d="M-12 16 q-16 -2 -18 -20" stroke="#4a7a5e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M26 -10 q18 -10 16 -28" stroke="#4a7a5e" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- carrot -->
  <g transform="translate(196 330) rotate(-18)">
    <path d="M0 -56 q10 40 34 56 q-20 20 -48 6 q-6 -34 14 -62 Z" fill="#e58f65"/>
    <path d="M14 -54 q-16 -2 -20 -24" stroke="#4a7a5e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M22 -50 q2 -18 18 -22" stroke="#7da77e" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- banana (green tips) -->
  <g transform="translate(268 272) rotate(14)">
    <path d="M-44 -20 q30 -58 78 -46 q-26 6 -34 26 q-34 4 -44 20 Z" fill="#e8c86e"/>
    <path d="M30 -62 q18 2 24 14" stroke="#4a7a5e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-50 -16 q-18 -2 -20 -16" stroke="#4a7a5e" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- dotted nutrition path feeding the bacteria -->
  <path d="M300 220 q40 -14 78 14" stroke="#7da77e" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="4 22"/>
  <path d="M300 290 q50 6 86 -18" stroke="#7da77e" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="4 22"/>

  <!-- plus accent -->
  <g stroke="#4a7a5e" stroke-width="6" stroke-linecap="round">
    <line x1="700" y1="418" x2="700" y2="446"/>
    <line x1="686" y1="432" x2="714" y2="432"/>
  </g>
</svg>